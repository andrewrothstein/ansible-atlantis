---
- name: Installing andrewrothstein.unarchivedeps
  ansible.builtin.include_role:
    name: andrewrothstein.unarchivedeps
- name: Resolve platform specific vars
  ansible.builtin.include_vars: '{{ item }}'
  with_first_found:
    - files:
        - '{{ ansible_distribution }}-{{ ansible_distribution_release }}.yml'
        - '{{ ansible_distribution }}.yml'
        - '{{ ansible_os_family }}.yml'
      skip: true
      paths:
        - '{{ role_path }}/vars'

- name: Checking for install in {{ atlantis_exe }}
  become: true
  ansible.builtin.stat:
    path: '{{ atlantis_exe }}'
  changed_when: false
  register: atlantis_bin

- name: Downloading and installing atlantis
  when: not atlantis_bin.stat.exists
  block:
    - name: Downloading {{ atlantis_url }}...
      become: true
      become_user: root
      ansible.builtin.get_url:
        url: '{{ atlantis_url }}'
        dest: '{{ atlantis_tmp_zip }}'
        checksum: '{{ atlantis_checksum }}'
        mode: '644'
    - name: Mkdir -p {{ atlantis_install_dir }}
      become: true
      become_user: root
      ansible.builtin.file:
        path: '{{ atlantis_install_dir }}'
        state: directory
        mode: '755'
    - name: Unarchiving {{ atlantis_tmp_zip }} to {{ atlantis_install_dir }}
      become: true
      become_user: root
      ansible.builtin.unarchive:
        remote_src: true
        src: '{{ atlantis_tmp_zip }}'
        dest: '{{ atlantis_install_dir }}'
        creates: '{{ atlantis_exe }}'
  always:
    - name: Rm -f {{ atlantis_tmp_zip }}
      become: true
      become_user: root
      ansible.builtin.file:
        path: '{{ atlantis_tmp_zip }}'
        state: absent
- name: Linking {{ atlantis_link }} to {{ atlantis_exe }}
  become: true
  become_user: root
  ansible.builtin.file:
    src: '{{ atlantis_exe }}'
    dest: '{{ atlantis_link }}'
    state: link
