---
- name: Testing andrewrothstein.atlantis
  hosts: all
  roles:
    - role: '{{ playbook_dir }}'
  tasks:
    - name: Executing 'atlantis version'
      ansible.builtin.command: atlantis version
      changed_when: false
      register: atlantis_test_output
    - name: Output from 'atlantis version'
      ansible.builtin.debug:
        msg: '{{ atlantis_test_output.stdout }}'
